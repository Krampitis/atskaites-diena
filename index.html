<style>
:root {
  --paper: #f6f2e9;
  --ink: #16130d;
  --mute: #8a8474;
  --rust: #b5402f;
  --hairline: rgba(22, 19, 13, .14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

::selection { background: var(--rust); color: var(--paper); }

body {
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.sheet {
  text-align: center;
  width: 100%;
  max-width: 720px;
  animation: rise .7s cubic-bezier(.22,.9,.3,1) both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

.kicker {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 5px;
  margin-right: -5px;
  text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 48px;
}

.days {
  font-weight: 500;
  font-size: clamp(32px, 9vw, 68px);
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
  line-height: 1;
}

.days-label {
  font-size: 12px;
  letter-spacing: 3px;
  margin-right: -3px;
  text-transform: uppercase;
  color: var(--mute);
  margin-top: 14px;
}

hr {
  border: none;
  border-top: 1px solid var(--ink);
  width: 64px;
  margin: 48px auto 22px;
}

.foot {
  font-size: 13px;
  color: var(--mute);
}
.foot b {
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}

.cycle {
  width: 160px;
  height: 1px;
  background: var(--hairline);
  margin: 22px auto 0;
  position: relative;
  overflow: hidden;
}
.cycle i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: var(--rust);
  transition: width 1s linear;
}

.since {
  font-size: 11px;
  color: var(--mute);
  letter-spacing: .4px;
  margin-top: 22px;
  font-variant-numeric: tabular-nums;
}
.since b {
  font-weight: 500;
  color: var(--ink);
}
.since b::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--rust);
  margin-right: 8px;
  vertical-align: 1px;
}

@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  .cycle i { transition: none; }
}

<body>
<main class="sheet">

  <h1 class="kicker" id="kicker"></h1>

  <div class="days" id="days">0</div>
  <div class="days-label" id="days-label">dienas</div>

  <hr>

  <p class="foot" id="readable"></p>

  <div class="cycle" role="presentation" id="cycle-cont"><i id="cycle-fill"></i></div>

  <p class="since"><b id="start-date"></b></p>

</main>

<script>
/* ------- iestatījumi ------- */
const START = new Date('2026-09-14T00:00:00');
const LABEL = 'Atskaites diena';
/* --------------------------- */

const $ = id => document.getElementById(id);
$('kicker').textContent = LABEL;

function pluralLV(n, one, many) {
  return (n % 10 === 1 && n % 100 !== 11) ? one : many;
}

const MONTHS_GEN = ['janvāra','februāra','marta','aprīļa','maija','jūnija',
                     'jūlija','augusta','septembra','oktobra','novembra','decembra'];

function fmtDate(d) {
  return 'no ' + d.getFullYear() + '. gada ' + d.getDate() + '. ' + MONTHS_GEN[d.getMonth()];
}

/* Pievieno mēnešus datumam, saudzīgi apstrādājot mēnešus ar mazāku dienu skaitu */
function addMonthsClamped(date, months) {
  const idx = date.getMonth() + months;
  const y = date.getFullYear() + Math.floor(idx / 12);
  const m = ((idx % 12) + 12) % 12;
  const daysInTarget = new Date(y, m + 1, 0).getDate();
  const day = Math.min(date.getDate(), daysInTarget);
  return new Date(y, m, day, date.getHours(), date.getMinutes(), date.getSeconds());
}

function calendarMonths(from, to) {
  let m = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
  if (addMonthsClamped(from, m) > to) m--;
  return Math.max(0, m);
}

/* Dienu starpība pēc kalendāra datumiem, nevis milisekundēm,
   lai vasaras/ziemas laika pāreja neizkropļo skaitu */
function calendarDays(from, to) {
  const a = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
  const b = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
  return Math.round((b - a) / 86400000);
}

$('start-date').textContent = fmtDate(START);

function update() {
  const now = new Date();

  if (now < START) {
    $('days').textContent = '0';
    $('readable').style.display = 'none';
    $('cycle-cont').style.display = 'none';
    return;
  }

  const totalDays = calendarDays(START, now);
  $('days').textContent = totalDays;
  $('days-label').textContent = pluralLV(totalDays, 'diena', 'dienas');
  document.title = totalDays + ' ' + pluralLV(totalDays, 'diena', 'dienas') + ' · Atskaites diena';

  const monthsTotal = calendarMonths(START, now);
  const years = Math.floor(monthsTotal / 12);
  const months = monthsTotal % 12;

  /* Pilnais nogājušais periods, ligzdots: gadi, mēneši, dienas.
     Rāda tikai tad, kad ir pagājis vismaz mēnesis, citādi dublētu hero skaitli. */
  const monthAnchor = addMonthsClamped(START, monthsTotal);
  const daysRem = calendarDays(monthAnchor, now);

  const parts = [];
  if (years > 0) parts.push('<b>' + years + '</b> ' + pluralLV(years, 'gads', 'gadi'));
  if (months > 0) parts.push('<b>' + months + '</b> ' + pluralLV(months, 'mēnesis', 'mēneši'));

  if (parts.length === 0) {
    $('readable').style.display = 'none';
  } else {
    parts.push('<b>' + daysRem + '</b> ' + pluralLV(daysRem, 'diena', 'dienas'));
    $('readable').innerHTML = parts.slice(0, -1).join(', ') + ' un ' + parts[parts.length - 1];
    $('readable').style.display = '';
  }

  /* Sarkanā josla vienmēr atspoguļo gada ciklu: no pēdējās gadadienas
     līdz nākamajai, arī pirmajā gadā (kur "pēdējā gadadiena" ir pats sākums). */
  const cycleStart = addMonthsClamped(START, years * 12);
  const cycleEnd = addMonthsClamped(START, (years + 1) * 12);
  const pct = Math.min(100, Math.max(0, (now - cycleStart) / (cycleEnd - cycleStart) * 100));
  $('cycle-fill').style.width = pct.toFixed(4) + '%';
  $('cycle-cont').style.display = '';
}

update();
setInterval(update, 1000);
</script>
